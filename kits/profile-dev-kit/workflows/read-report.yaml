id: read-report
name: Read Verification Report
description: Reads the latest persisted Verification Report for a Change and its append-only history without running verification or writing records.
version: "1.0"
requires_kits:
  - profile-dev-kit
allowed_tools:
  - profile_read_report
inputs:
  - repo_path
  - change_id
steps:
  - id: read
    primitive: tool
    config:
      tool: profile_read_report
      arguments:
        repo_path: "$input.repo_path"
        change_id: "$input.change_id"
