id: implement-story
name: Implement Story
description: Entry implement stage where a Coding agent implements one unit of one spec through agent-exec; the kit checks, gates and commits only that unit's paths on a feature branch. A Gate that regresses gets one bounded repair call and one more settle. It never pushes, verifies, approves or integrates.
version: "1.0"
requires_kits:
  - profile-dev-kit
  - agent-kiro-kit
allowed_tools:
  - profile_implement_prepare
  - profile_implement_settle
  - profile_record_stage_outcome
  - profile_hook_open
  - profile_hook_arm
  - profile_hook_disarm
  - profile_hook_proof
  - profile_stage_instruction
inputs:
  - repo_path
  - story_key
  - spec_path
  - branch
  - base_ref
  - instruction
steps:
  - id: hook_open
    primitive: tool
    execution_strategy:
      type: skip
    config:
      tool: profile_hook_open
      arguments:
        stage: implement
  - id: prepare
    primitive: tool
    execution_strategy:
      type: skip
    config:
      tool: profile_implement_prepare
      arguments:
        repo_path: "$input.repo_path"
        story_key: "$input.story_key"
        spec_path: "$input.spec_path"
        branch: "$input.branch"
        base_ref: "$input.base_ref"
  - id: method
    primitive: tool
    if: "$input.instruction"
    execution_strategy:
      type: fail
    config:
      tool: profile_stage_instruction
      arguments:
        stage: implement
        instruction: "$input.instruction"
  - id: arm
    primitive: tool
    if: "$stepResult.prepare.result.implement == true"
    execution_strategy:
      type: fail
    config:
      tool: profile_hook_arm
      arguments:
        repo_path: "$input.repo_path"
        stage: implement
        hook: "$stepResult.hook_open.result"
        method: "$stepResult.method.result"
  - id: implement
    primitive: agent-exec
    if: "$stepResult.arm.result.native == true"
    execution_strategy:
      type: skip
    timeout: 600
    config:
      adapter: kiro-cli
      sandbox: workspace-write
      prompt: >-
        You are the Coding agent for one implementation unit. Read the spec at
        $input.spec_path and implement only the paths named by
        $stepResult.prepare.result.unit_paths for unit
        $stepResult.prepare.result.unit_id Change only those paths and files under
        them. Leave the spec unchanged. Do not stage, commit, push, create or switch
        branches, approve, verify or integrate.
  - id: implement_method
    primitive: agent-exec
    if: "$stepResult.arm.result.method == true"
    output_key: implement
    execution_strategy:
      type: skip
    timeout: 600
    config:
      adapter: kiro-cli
      sandbox: workspace-write
      prompt: >-
        You are the Coding agent for one implementation unit. Read the spec at
        $input.spec_path and implement only the paths named by
        $stepResult.prepare.result.unit_paths for unit
        $stepResult.prepare.result.unit_id Change only those paths and files under
        them. Leave the spec unchanged. Do not stage, commit, push, create or switch
        branches, approve, verify or integrate. Method instruction: $stepResult.method.result.instruction
  - id: disarm
    primitive: tool
    if: "$stepResult.prepare.result.implement == true"
    execution_strategy:
      type: fail
    config:
      tool: profile_hook_disarm
      arguments:
        repo_path: "$input.repo_path"
        armed: "$stepResult.arm.result"
        agent: "$stepResult.implement"
  - id: settle
    primitive: tool
    execution_strategy:
      type: fail
    if: "$stepResult.prepare.result.implement == true"
    config:
      tool: profile_implement_settle
      arguments:
        repo_path: "$input.repo_path"
        story_key: "$input.story_key"
        spec_path: "$input.spec_path"
        branch: "$input.branch"
        base_ref: "$input.base_ref"
        prepare: "$stepResult.prepare.result"
        agent: "$stepResult.implement"
  - id: repair_arm
    primitive: tool
    if: "$stepResult.settle.result.repair == true"
    execution_strategy:
      type: fail
    config:
      tool: profile_hook_arm
      arguments:
        repo_path: "$input.repo_path"
        stage: implement
        hook: "$stepResult.hook_open.result"
  - id: repair
    primitive: agent-exec
    if: "$stepResult.repair_arm.result.native == true"
    execution_strategy:
      type: skip
    timeout: 600
    config:
      adapter: kiro-cli
      sandbox: workspace-write
      prompt: >-
        You are the Coding agent for one bounded repair round of implementation
        unit $stepResult.prepare.result.unit_id These kit Gates passed before
        your change and fail after it: $stepResult.settle.result.refs.regressed
        Fix only those failures, changing only the paths
        $stepResult.prepare.result.unit_paths and files under them. Leave the
        spec unchanged. Do not stage, commit, push, create or switch branches,
        approve, verify or integrate.
  - id: repair_disarm
    primitive: tool
    if: "$stepResult.settle.result.repair == true"
    execution_strategy:
      type: fail
    config:
      tool: profile_hook_disarm
      arguments:
        repo_path: "$input.repo_path"
        armed: "$stepResult.repair_arm.result"
        agent: "$stepResult.repair"
  - id: resettle
    primitive: tool
    execution_strategy:
      type: fail
    if: "$stepResult.prepare.result.implement == true"
    config:
      tool: profile_implement_settle
      arguments:
        repo_path: "$input.repo_path"
        story_key: "$input.story_key"
        spec_path: "$input.spec_path"
        branch: "$input.branch"
        base_ref: "$input.base_ref"
        prepare: "$stepResult.prepare.result"
        agent: "$stepResult.repair"
        prior: "$stepResult.settle.result"
  - id: settle_stop
    primitive: tool
    execution_strategy:
      type: fail
    if: "$stepResult.prepare.result.implement != true"
    config:
      tool: profile_implement_settle
      arguments:
        repo_path: "$input.repo_path"
        story_key: "$input.story_key"
        spec_path: "$input.spec_path"
        branch: "$input.branch"
        base_ref: "$input.base_ref"
        prepare: "$stepResult.prepare.result"
  - id: proof
    primitive: tool
    if: "$stepResult.prepare.result.implement == true"
    execution_strategy:
      type: fail
    config:
      tool: profile_hook_proof
      arguments:
        stage: implement
        hook: "$stepResult.hook_open.result"
        calls:
          - "$stepResult.arm.result"
          - "$stepResult.repair_arm.result"
        timings:
          - "$stepResult.disarm.result"
          - "$stepResult.repair_disarm.result"
        settled: "$stepResult.resettle.result"
  - id: proof_stop
    primitive: tool
    if: "$stepResult.prepare.result.implement != true"
    execution_strategy:
      type: fail
    config:
      tool: profile_hook_proof
      arguments:
        stage: implement
        hook: "$stepResult.hook_open.result"
        calls: []
        timings: []
        settled: "$stepResult.settle_stop.result"
  - id: record
    primitive: tool
    execution_strategy:
      type: fail
    if: "$stepResult.prepare.result.implement == true"
    config:
      tool: profile_record_stage_outcome
      arguments:
        repo_path: "$input.repo_path"
        story_key: "$stepResult.proof.result.story_key"
        stage: "$stepResult.proof.result.stage"
        outcome: "$stepResult.proof.result.outcome"
        reason: "$stepResult.proof.result.reason"
        refs: "$stepResult.proof.result.refs"
  - id: record_stop
    primitive: tool
    execution_strategy:
      type: fail
    if: "$stepResult.prepare.result.implement != true"
    config:
      tool: profile_record_stage_outcome
      arguments:
        repo_path: "$input.repo_path"
        story_key: "$stepResult.proof_stop.result.story_key"
        stage: "$stepResult.proof_stop.result.stage"
        outcome: "$stepResult.proof_stop.result.outcome"
        reason: "$stepResult.proof_stop.result.reason"
        refs: "$stepResult.proof_stop.result.refs"
