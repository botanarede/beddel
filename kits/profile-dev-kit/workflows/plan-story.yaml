id: plan-story
name: Plan Story
description: Entry plan stage that turns one selected story into one implementation spec written by a Coding agent through agent-exec; it never implements, verifies or commits.
version: "1.0"
requires_kits:
  - profile-dev-kit
  - agent-kiro-kit
allowed_tools:
  - profile_plan_reconcile
  - profile_plan_settle
  - profile_record_stage_outcome
  - profile_hook_open
  - profile_hook_arm
  - profile_hook_disarm
  - profile_hook_proof
  - profile_stage_instruction
inputs:
  - repo_path
  - story_key
  - story_path
  - guide_path
  - spec_path
  - instruction
steps:
  - id: hook_open
    primitive: tool
    execution_strategy:
      type: skip
    config:
      tool: profile_hook_open
      arguments:
        stage: plan
  - id: reconcile
    primitive: tool
    execution_strategy:
      type: skip
    config:
      tool: profile_plan_reconcile
      arguments:
        repo_path: "$input.repo_path"
        story_key: "$input.story_key"
        story_path: "$input.story_path"
        guide_path: "$input.guide_path"
        spec_path: "$input.spec_path"
  - id: method
    primitive: tool
    if: "$input.instruction"
    execution_strategy:
      type: fail
    config:
      tool: profile_stage_instruction
      arguments:
        stage: plan
        instruction: "$input.instruction"
  - id: arm
    primitive: tool
    if: "$stepResult.reconcile.result.author == true"
    execution_strategy:
      type: fail
    config:
      tool: profile_hook_arm
      arguments:
        repo_path: "$input.repo_path"
        stage: plan
        hook: "$stepResult.hook_open.result"
        method: "$stepResult.method.result"
  - id: author
    primitive: agent-exec
    if: "$stepResult.arm.result.native == true"
    execution_strategy:
      type: skip
    timeout: 600
    config:
      adapter: kiro-cli
      sandbox: workspace-write
      prompt: >-
        You are the Coding agent for one plan stage. Read the selected story source at
        $input.story_path and the planning guide at $input.guide_path and write exactly one
        complete implementation spec to $input.spec_path and ensure its YAML front matter
        contains story_key, requirements, repositories, dependencies, size_cap_bytes and
        a units list, each entry with an id, the repository-relative paths it may change
        and a Conventional Commit subject;
        set story_key to $input.story_key and size_cap_bytes to 64000. Keep the spec
        within the 64000-byte cap. Change no other file. Do not implement, test, verify,
        commit or push.
  - id: author_method
    primitive: agent-exec
    if: "$stepResult.arm.result.method == true"
    output_key: author
    execution_strategy:
      type: skip
    timeout: 600
    config:
      adapter: kiro-cli
      sandbox: workspace-write
      prompt: >-
        You are the Coding agent for one plan stage. Read the selected story source at
        $input.story_path and the planning guide at $input.guide_path and write exactly one
        complete implementation spec to $input.spec_path and ensure its YAML front matter
        contains story_key, requirements, repositories, dependencies, size_cap_bytes and
        a units list, each entry with an id, the repository-relative paths it may change
        and a Conventional Commit subject;
        set story_key to $input.story_key and size_cap_bytes to 64000. Keep the spec
        within the 64000-byte cap. Change no other file. Do not implement, test, verify,
        commit or push. Method instruction: $stepResult.method.result.instruction
  - id: disarm
    primitive: tool
    if: "$stepResult.reconcile.result.author == true"
    execution_strategy:
      type: fail
    config:
      tool: profile_hook_disarm
      arguments:
        repo_path: "$input.repo_path"
        armed: "$stepResult.arm.result"
        agent: "$stepResult.author"
  - id: settle
    primitive: tool
    execution_strategy:
      type: fail
    config:
      tool: profile_plan_settle
      arguments:
        repo_path: "$input.repo_path"
        story_key: "$input.story_key"
        story_path: "$input.story_path"
        guide_path: "$input.guide_path"
        spec_path: "$input.spec_path"
        reconcile: "$stepResult.reconcile.result"
  - id: proof
    primitive: tool
    execution_strategy:
      type: fail
    config:
      tool: profile_hook_proof
      arguments:
        stage: plan
        hook: "$stepResult.hook_open.result"
        calls:
          - "$stepResult.arm.result"
        timings:
          - "$stepResult.disarm.result"
        settled: "$stepResult.settle.result"
  - id: record
    primitive: tool
    execution_strategy:
      type: fail
    config:
      tool: profile_record_stage_outcome
      arguments:
        repo_path: "$input.repo_path"
        story_key: "$stepResult.proof.result.story_key"
        stage: "$stepResult.proof.result.stage"
        outcome: "$stepResult.proof.result.outcome"
        reason: "$stepResult.proof.result.reason"
        refs: "$stepResult.proof.result.refs"
