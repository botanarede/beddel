name: profile-dev-kit
version: 0.1.0
description: >
  Development profile kit: entry workflow and fail-closed preflight for
  verifying a change in a Git repository; ratified inventory binding; the
  Change, its Impact (footprint, Affected points, Required evidence), the
  deterministic local Gate over that derived set (an operational outcome of
  exit codes, never Evidence or a Verdict), the external Review of that derived
  set through the configured agent route (an operational outcome of completed,
  timed out or errored, never Evidence or a Verdict), append-only Evidence for
  matching attempt-bound results, the persisted Verification Report and its
  read-only history, and the recorded determination of non-applicability.
author: Beddel Team
category: profile # descriptive only; SolutionKit ignores it

# Documentation only. The runtime source of these values is
# python/beddel_profile_dev/config.py, never this block.
config:
  gate_executables: [git, pytest, ruff, mypy]
  required_env_keys: []
  inventory_dir: ".beddel-profile/inventory"
  # Resolved relative to the Beddel setup directory, not the repository.
  records_dir: "records/profile-dev"
  gate_commands:
    - [ruff, check, "."]
    - [ruff, format, --check, "."]
    - [mypy, "."]
    - [pytest, -q]
  gate_timeout_seconds: 300
  gate_total_timeout_seconds: 1200
  review_agent: kiro
  review_model: claude-opus-4.5
  review_timeout_seconds: 900

tools:
  - name: profile_preflight
    target: "beddel_profile_dev.tools.preflight:profile_preflight"
    description: "Fail-closed preflight: Git work tree, gate executables, required env keys"
    category: profile
  - name: profile_ratify_inventory
    target: "beddel_profile_dev.tools.ratify:profile_ratify_inventory"
    description: "Record the maintainer's ratification of an inventory version (transport only)"
    category: profile
  - name: profile_bind_inventory
    target: "beddel_profile_dev.tools.bind:profile_bind_inventory"
    description: "Validate a ratified inventory version at a revision and bind its snapshot"
    category: profile
  - name: profile_record_change
    target: "beddel_profile_dev.tools.change:profile_record_change"
    description: "Record a Change (id and base) and the link of its Analyzed revision"
    category: profile
  - name: profile_derive_impact
    target: "beddel_profile_dev.tools.impact:profile_derive_impact"
    description: "Derive the footprint, Affected points and Required evidence of a Change"
    category: profile
  - name: profile_open_attempt
    target: "beddel_profile_dev.tools.attempt:profile_open_attempt"
    description: "Persist the immutable VerificationAttempt scope after Impact"
    category: profile
  - name: profile_run_gate
    target: "beddel_profile_dev.tools.gate:profile_run_gate"
    description: "Run the configured local gate commands over the derived set and record exit codes (operational outcome, not Evidence)"
    category: profile
  - name: profile_run_review
    target: "beddel_profile_dev.tools.review:profile_run_review"
    description: "Run the external Review of a Change through the configured agent route over its recorded derived set and record the operational outcome (not Evidence, not a Verdict)"
    category: profile
  - name: profile_capture_evidence
    target: "beddel_profile_dev.tools.evidence:profile_capture_evidence"
    description: "Capture append-only Evidence for the matching results of one VerificationAttempt"
    category: profile
  - name: profile_record_report
    target: "beddel_profile_dev.tools.report:profile_record_report"
    description: "Build and persist one append-only Verification Report for a Change"
    category: profile
  - name: profile_read_report
    target: "beddel_profile_dev.tools.report:profile_read_report"
    description: "Read the latest persisted Verification Report and its append-only history"
    category: profile
  - name: profile_read_reverification
    target: "beddel_profile_dev.tools.publication:profile_read_reverification"
    description: "Read the recorded Re-verification entry of the latest stored Report without writing records"
    category: profile
  - name: profile_declare_non_applicability
    target: "beddel_profile_dev.tools.determine:profile_declare_non_applicability"
    description: "Record the maintainer's determination that an obligation with an absent target is not applicable (transport only)"
    category: profile
  - name: profile_approve_change
    target: "beddel_profile_dev.tools.approval:profile_approve_change"
    description: "Revalidate a Change and accept its Approval from a committed decision"
    category: profile
  - name: profile_record_approval_decision
    target: "beddel_profile_dev.tools.approval_decision:profile_record_approval_decision"
    description: "Record an Approval decision for the maintainer to commit"
    category: profile
  - name: profile_read_approval
    target: "beddel_profile_dev.tools.approval:profile_read_approval"
    description: "Read the stored Change Approval without writing records"
    category: profile
  - name: profile_plan_reconcile
    target: "beddel_profile_dev.tools.plan:profile_plan_reconcile"
    description: "Reconcile one story with one implementation spec"
    category: profile
  - name: profile_plan_settle
    target: "beddel_profile_dev.tools.plan:profile_plan_settle"
    description: "Settle a plan stage without writing or committing the spec"
    category: profile
  - name: profile_record_stage_outcome
    target: "beddel_profile_dev.tools.stage_outcome:profile_record_stage_outcome"
    description: "Append one create-only Stage outcome record outside the repository"
    category: profile
  - name: profile_implement_prepare
    target: "beddel_profile_dev.tools.implement:profile_implement_prepare"
    description: "Prepare one implementation unit on a feature branch"
    category: profile
  - name: profile_implement_settle
    target: "beddel_profile_dev.tools.implement:profile_implement_settle"
    description: "Review and commit one implementation unit"
    category: profile
  - name: profile_fix_reconcile
    target: "beddel_profile_dev.tools.fix:profile_fix_reconcile"
    description: "Reconcile one bounded verification fix round"
    category: profile
  - name: profile_fix_settle
    target: "beddel_profile_dev.tools.fix:profile_fix_settle"
    description: "Validate and commit one verification fix round"
    category: profile
  - name: profile_integrate_prepare
    target: "beddel_profile_dev.tools.integrate:profile_integrate_prepare"
    description: "Prepare one approved Change for integration"
    category: profile
  - name: profile_integrate_reconcile
    target: "beddel_profile_dev.tools.integrate:profile_integrate_reconcile"
    description: "Reconcile remote integration state"
    category: profile
  - name: profile_integrate_settle
    target: "beddel_profile_dev.tools.integrate:profile_integrate_settle"
    description: "Settle the parent integration boundary"
    category: profile

workflows:
  - name: verify-change
    path: workflows/verify-change.yaml
    description: Entry workflow of the development profile (preflight, Change, inventory binding, Impact, VerificationAttempt, Gate, Review, Evidence and Report)
  - name: read-report
    path: workflows/read-report.yaml
    description: Reads the latest persisted Verification Report and its history without running verification or writing records
  - name: publish-reverification
    path: workflows/publish-reverification.yaml
    description: Publishes a one-way copy of the recorded Re-verification entry through the configured MCP destination; never blocks a verification
  - name: ratify-inventory
    path: workflows/ratify-inventory.yaml
    description: Records the ratification of an inventory version
  - name: declare-non-applicability
    path: workflows/declare-non-applicability.yaml
    description: Records the determination of non-applicability of one obligation with an absent target
  - name: approve-change
    path: workflows/approve-change.yaml
    description: Revalidates a Change and accepts Approval from a committed decision.
  - name: record-approval-decision
    path: workflows/record-approval-decision.yaml
    description: Records an Approval decision for the maintainer to commit.
  - name: read-approval
    path: workflows/read-approval.yaml
    description: Reads the stored Change Approval without writing records.
  - name: implement-story
    path: workflows/implement-story.yaml
    description: Implements one unit of one spec through a Coding agent and commits only its declared paths; never pushes, verifies or integrates.
  - name: verify-and-fix-story
    path: workflows/verify-and-fix-story.yaml
    description: Runs verify-change unchanged and applies at most two bounded fix rounds with fresh verification attempts; never approves, ratifies, pushes or integrates.
  - name: plan-story
    path: workflows/plan-story.yaml
    description: Plans one selected story into one implementation spec through a Coding agent; never implements, verifies or commits.
  - name: integrate-story
    path: workflows/integrate-story.yaml
    description: Integrates one approved Change through the repository host and records the parent boundary; never approves, verifies or pushes the parent.

targets:
  python:
    status: implemented
    module: beddel_profile_dev
    dependencies: []
    tools:
      - name: profile_preflight
        target: "beddel_profile_dev.tools.preflight:profile_preflight"
      - name: profile_ratify_inventory
        target: "beddel_profile_dev.tools.ratify:profile_ratify_inventory"
      - name: profile_bind_inventory
        target: "beddel_profile_dev.tools.bind:profile_bind_inventory"
      - name: profile_record_change
        target: "beddel_profile_dev.tools.change:profile_record_change"
      - name: profile_derive_impact
        target: "beddel_profile_dev.tools.impact:profile_derive_impact"
      - name: profile_open_attempt
        target: "beddel_profile_dev.tools.attempt:profile_open_attempt"
      - name: profile_run_gate
        target: "beddel_profile_dev.tools.gate:profile_run_gate"
      - name: profile_run_review
        target: "beddel_profile_dev.tools.review:profile_run_review"
      - name: profile_capture_evidence
        target: "beddel_profile_dev.tools.evidence:profile_capture_evidence"
      - name: profile_record_report
        target: "beddel_profile_dev.tools.report:profile_record_report"
      - name: profile_read_report
        target: "beddel_profile_dev.tools.report:profile_read_report"
      - name: profile_read_reverification
        target: "beddel_profile_dev.tools.publication:profile_read_reverification"
      - name: profile_declare_non_applicability
        target: "beddel_profile_dev.tools.determine:profile_declare_non_applicability"
      - name: profile_approve_change
        target: "beddel_profile_dev.tools.approval:profile_approve_change"
      - name: profile_record_approval_decision
        target: "beddel_profile_dev.tools.approval_decision:profile_record_approval_decision"
      - name: profile_read_approval
        target: "beddel_profile_dev.tools.approval:profile_read_approval"
      - name: profile_plan_reconcile
        target: "beddel_profile_dev.tools.plan:profile_plan_reconcile"
      - name: profile_plan_settle
        target: "beddel_profile_dev.tools.plan:profile_plan_settle"
      - name: profile_record_stage_outcome
        target: "beddel_profile_dev.tools.stage_outcome:profile_record_stage_outcome"
      - name: profile_implement_prepare
        target: "beddel_profile_dev.tools.implement:profile_implement_prepare"
      - name: profile_implement_settle
        target: "beddel_profile_dev.tools.implement:profile_implement_settle"
      - name: profile_fix_reconcile
        target: "beddel_profile_dev.tools.fix:profile_fix_reconcile"
      - name: profile_fix_settle
        target: "beddel_profile_dev.tools.fix:profile_fix_settle"
      - name: profile_integrate_prepare
        target: "beddel_profile_dev.tools.integrate:profile_integrate_prepare"
      - name: profile_integrate_reconcile
        target: "beddel_profile_dev.tools.integrate:profile_integrate_reconcile"
      - name: profile_integrate_settle
        target: "beddel_profile_dev.tools.integrate:profile_integrate_settle"
  typescript:
    status: unavailable
    unavailable_reason: >
      AD-15: the profile kit is Python-only. Its preflight and gates
      orchestrate local executables and have no TypeScript target.
