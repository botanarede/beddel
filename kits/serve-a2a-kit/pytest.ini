[pytest]
testpaths = tests

# Registered so `-m integration` / `-m "not integration"` are usable in CI
# without emitting PytestUnknownMarkWarning. Deliberately NOT wired into
# `addopts`: the default run collects and executes everything.
markers =
    integration: end-to-end A2A conformance tests against real SDK components (in-process ASGI, `beddel serve` subprocess, and CLI enablement-gate app builds)
