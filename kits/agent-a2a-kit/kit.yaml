name: agent-a2a-kit
version: 0.3.0
description: A2A Protocol kit — outbound client adapter for A2A-compliant agents
author: Beddel Team
adapters:
- port: IAgentAdapter
  implementation: A2AAgentAdapter
  description: Agent adapter for A2A Protocol compliant agents (outbound client)
targets:
  python:
    status: implemented
    module: beddel_agent_a2a
    dependencies:
    - a2a-sdk==1.1.2
    adapters:
    - port: IAgentAdapter
      name: a2a
      target: beddel_agent_a2a.adapter:A2AAgentAdapter
  typescript:
    status: planned
    implementation_path: ./typescript/src/a2a.ts
